<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avalisa sign in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; color: #e2e8f0; padding: 0; }
    input {
      width: 100%; padding: 7px 9px; margin-bottom: 6px; font-size: 12px;
      font-family: inherit; color: #e2e8f0; background: #0f1830;
      border: 1px solid #2a4060; border-radius: 6px;
    }
    input:focus { outline: none; border-color: #7c3aed; }
    button {
      width: 100%; padding: 8px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;
      background: #f4c95d; color: #15120a;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { font-size: 11px; line-height: 1.4; min-height: 14px; margin-top: 5px; }
    .msg.error { color: #f87171; }
    .msg.ok { color: #34d399; }
    .note { font-size: 10px; color: #64748b; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>
  <input id="email" type="email" placeholder="Email" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="submit">Sign in</button>
  <div class="msg" id="msg"></div>
  <div class="note">Typed inside the extension, not the Pocket Option page.</div>
  <script src="login.js"></script>
</body>
</html>
